<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light">
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/k-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preload" href="%sveltekit.assets%/fonts/PressStart2P.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%sveltekit.assets%/fonts/RobotoMono.woff2" as="font" type="font/woff2" crossorigin />

    <script>
      (function() {
        var s = localStorage.getItem('theme');
        var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
      })();
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
